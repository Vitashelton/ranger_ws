shared_control_filter:
  ros__parameters:
    human_cmd_topic: /cmd_vel_raw
    safe_cmd_topic: /cmd_vel_safe
    odom_topic: /odom
    risk_grid_topic: /local_risk_grid
    semantic_target_topic: /semantic_target_pose

    loop_hz: 20.0
    horizon_s: 1.20
    rollout_dt: 0.15

    # RangerMini 2.0 low-speed shared-control limits for early real tests
    max_vx: 0.35
    max_vy: 0.30
    max_wz: 0.70
    max_acc: 0.45

    # Candidate velocity sampling around human command
    vx_samples: [-0.10, 0.00, 0.10, 0.20, 0.30]
    vy_offsets: [-0.18, -0.09, 0.0, 0.09, 0.18]
    wz_offsets: [-0.35, 0.0, 0.35]

    # Costs
    w_intent: 2.2
    w_risk: 8.0
    w_goal: 1.2
    w_progress: 0.8
    w_smooth: 0.3
    risk_reject_threshold: 75.0

    # Footprint approximation; RangerMini 2.0 footprint should be verified on the real platform.
    robot_length_m: 0.78
    robot_width_m: 0.58
    footprint_margin_m: 0.08

    # four-steer visualization
    wheelbase_m: 0.56
    track_m: 0.46

    publish_debug_markers: true
