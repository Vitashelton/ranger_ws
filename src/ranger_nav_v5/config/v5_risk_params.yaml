local_bev_risk_node:
  ros__parameters:
    scan_topic: /scan
    cloud_topic: /livox/lidar
    risk_grid_topic: /local_risk_grid
    base_frame: base_link
    grid_width_m: 8.0
    grid_height_m: 8.0
    resolution: 0.05
    publish_hz: 10.0

    # MID360 / D435i risk construction
    use_scan: true
    use_cloud: true
    max_range_m: 6.0
    min_range_m: 0.08
    obstacle_height_min: 0.05
    obstacle_height_max: 1.80
    cloud_downsample_step: 5

    # occupancy / inflation
    occupied_value: 100
    inflation_radius_m: 0.28
    lethal_radius_m: 0.16
    temporal_decay: 0.92

    # debug
    publish_bev_image: true
    publish_markers: true
