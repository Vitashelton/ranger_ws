pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.2

    min_height: -0.50
    max_height: 0.80

    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0174533

    scan_time: 0.1
    range_min: 0.40
    range_max: 8.0

    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1
